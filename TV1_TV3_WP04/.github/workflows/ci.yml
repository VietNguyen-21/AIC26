name: TV1 + TV3 Reliability Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependency-light development environment
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src backend tests scripts models

      - name: Ruff critical correctness rules
        run: ruff check src tests backend scripts models

      - name: Mypy hardened TV3 modules
        run: mypy src/aic2026/evidence_catalog.py src/aic2026/model_certification.py src/aic2026/benchmarking.py

      - name: Full suite with coverage gate
        run: |
          mkdir -p .ci
          pytest -q \
            --cov=src/aic2026 \
            --cov-report=term-missing \
            --cov-report=xml:.ci/coverage.xml \
            --cov-fail-under=80

      - name: Schema export contract
        run: aic export-schemas --output .ci/schemas

      - name: Remove generated CI artifacts
        run: rm -rf .ci .pytest_cache .coverage htmlcov

      - name: Source-only privacy audit
        run: aic release-audit --root .
