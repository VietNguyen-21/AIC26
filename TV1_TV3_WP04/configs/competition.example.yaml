# TEMPLATE ONLY. Copy this file to configs/local/competition.yaml and replace all CHANGE_ME values.
# configs/local/ is gitignored so personal machine paths/checkpoints are never pushed.
# Selected stack: DeepSolo+PARSeq / Silero+ChunkFormer / RF-DETR.

corpus:
  video_glob: '**/*.mp4'
  video_id_rule: relative_path_hash
  batch_id: local
  max_archive_members: 10000
  max_archive_uncompressed_bytes: 536870912000
  max_archive_compression_ratio: 200.0
media:
  ffprobe_timeout_seconds: 120
  decode_probe_points: 5
  create_audio: true
  audio_sample_rate_hz: 16000
  create_proxy: false
  build_full_frame_index: true
  frame_index_backend: pyav
  allow_ffmpeg_decode_fallback: false
  frame_index_timeout_seconds: 3600
  pts_timestamp_tolerance_ms: 2
  audio_duration_tolerance_ms: 1500
keyframes:
  strategy: hybrid_shot_max_gap
  shot_model: autoshoot_or_fallback
  sample_every_ms: 500
  shot_threshold: 0.48
  max_gap_ms: 5000
  min_shot_ms: 500
  representative_policy: quality_center
  representative_search_radius_ms: 600
  representative_candidate_step_ms: 200
  representative_candidate_cache_size: 64
  boundary_guard_ms: 250
  dedup_method: dhash
  dedup_threshold: 8
  dedup_temporal_window_ms: 15000
  thumbnail_width: 320
  autoshoot_repo_root: null
  autoshoot_checkpoint_path: null
  autoshoot_model_filename: supernet_flattransf_3_8_8_8_13_12_0_16_60.py
  autoshoot_checkpoint_key: net
  autoshoot_threshold: 0.296
  autoshoot_device: auto
  autoshoot_min_loaded_parameter_ratio: 0.99
  pyscenedetect_threshold: 27.0
  pyscenedetect_min_scene_len_frames: 15
  quality_sharpness_weight: 1.0
  quality_black_weight: 5.0
  quality_blur_weight: 1.0
  quality_face_weight: 0.0
  quality_text_weight: 0.0
  quality_center_bias: 0.25
ocr:
  enabled: true
  adapter: deep_solo_parseq
  device: cuda
  batch_size: 8
  confidence_threshold: 0.25
  keep_raw_below_threshold: true
  crop_evidence: true
  crop_padding_px: 4
  frame_resume: true
  fail_fast: false
  character_ngram_min: 2
  character_ngram_max: 4
  max_character_ngrams: 256
  deep_solo_parseq_checkpoint_path: CHANGE_ME/deepsolo_checkpoint.pth
  deep_solo_parseq_command:
  - python
  - CHANGE_ME/deep_solo_parseq_launcher.py
  - --image
  - '{image}'
  - --output
  - '{output}'
  - --checkpoint
  - '{checkpoint}'
  deep_solo_parseq_timeout_seconds: 120
  checkpoint_sha256: CHANGE_ME_64_HEX_SHA256
  allow_runtime_downloads: false
asr:
  enabled: true
  adapter: chunkformer
  vad_adapter: silero
  device: cuda
  language: vi
  task: transcribe
  batch_size: 8
  min_batch_size: 1
  max_oom_retries: 4
  allow_cpu_fallback: false
  vad_threshold: 0.5
  vad_min_speech_ms: 250
  vad_min_silence_ms: 500
  vad_speech_pad_ms: 200
  segment_max_ms: 30000
  segment_overlap_ms: 1000
  segment_merge_gap_ms: 300
  segment_resume: true
  fail_fast: false
  keep_chunk_audio: false
  chunkformer_checkpoint_path: CHANGE_ME/chunkformer_checkpoint.pt
  chunkformer_command:
  - python
  - CHANGE_ME/chunkformer_launcher.py
  - --audio
  - '{audio}'
  - --output
  - '{output}'
  - --checkpoint
  - '{checkpoint}'
  - --device
  - '{device}'
  chunkformer_timeout_seconds: 600
  checkpoint_sha256: CHANGE_ME_64_HEX_SHA256
  allow_runtime_downloads: false
object:
  enabled: true
  adapter: rfdetr
  device: cuda
  batch_size: 8
  frame_resume: true
  fail_fast: false
  confidence_threshold: 0.25
  keep_raw_below_threshold: true
  max_detections_per_frame: 300
  default_mode: soft_boost
  allowed_labels: []
  label_aliases: {}
  rfdetr_model_name: base
  rfdetr_checkpoint_path: CHANGE_ME/rfdetr_checkpoint.pth
  checkpoint_sha256: CHANGE_ME_64_HEX_SHA256
  allow_runtime_downloads: false
metadata:
  technical_enabled: true
  organizer_youtube_enabled: true
  auto_semantic_enabled: false
  organizer_metadata_root: data/organizer_support/metadata
  organizer_metadata_globs:
  - '*.jsonl'
  - '*.json'
  - '*.csv'
  - '*.tsv'
  - '*.xlsx'
  - '*.xlsm'
  strict_unknown_video: false
  max_unmatched_examples: 20
evidence_catalog:
  enabled: true
  database_name: evidence.sqlite3
  auto_build: true
  fail_open: false
  default_page_size: 100
  maximum_page_size: 1000
text_index:
  enabled: true
  adapter: local_bm25
  persistent: true
  index_name: aic2026_text
  local_database_name: local_bm25.sqlite3
  auto_build_if_missing: false
  fail_open: true
  allow_local_fallback: true
  include_below_threshold_ocr: false
  k1: 1.5
  b: 0.75
  exact_phrase_enabled: true
  exact_phrase_boost: 4.0
  no_diacritic_boost: 1.0
  fuzzy_enabled: true
  fuzzy_boost: 0.35
  fuzzy_max_edit_distance: 1
  fuzzy_min_token_length: 4
  fuzzy_candidate_limit: 128
  character_ngram_min: 2
  character_ngram_max: 4
  max_document_character_ngrams: 64
  max_query_character_ngrams: 64
  character_ngram_candidate_limit: 16
  character_ngram_boost: 0.18
  field_weights:
    ocr_text: 2.4
    ocr_text_no_diacritics: 2.0
    ocr_punctuation: 1.2
    ocr_char_ngrams: 0.35
    asr_text: 2.0
    asr_text_no_diacritics: 1.7
    asr_char_ngrams: 0.25
    organizer_metadata_title: 3.0
    organizer_metadata_description: 1.4
    organizer_metadata_tags: 2.2
    organizer_metadata_channel: 1.1
    organizer_metadata_text: 1.2
    organizer_metadata_text_no_diacritics: 1.0
    organizer_metadata_char_ngrams: 0.18
    auto_metadata_title: 1.8
    auto_metadata_description: 1.0
    auto_metadata_tags: 1.4
    auto_metadata_channel: 0.8
    auto_metadata_text: 1.0
    auto_metadata_text_no_diacritics: 0.8
    auto_metadata_char_ngrams: 0.15
    technical_metadata_title: 0.8
    technical_metadata_description: 0.5
    technical_metadata_tags: 0.5
    technical_metadata_channel: 0.4
    technical_metadata_text: 0.6
    technical_metadata_text_no_diacritics: 0.5
    technical_metadata_char_ngrams: 0.08
  remote_url: http://localhost:9200
  remote_verify_certs: true
  remote_timeout_seconds: 30
  remote_bulk_size: 500
  remote_username_env: AIC_TEXT_INDEX_USERNAME
  remote_password_env: AIC_TEXT_INDEX_PASSWORD
  remote_api_key_env: AIC_TEXT_INDEX_API_KEY
runtime:
  seed: 42
  workers_cpu: 4
  lock_timeout_seconds: 21600
  profile: competition
paths:
  data_root: data
  runs_root: data/runs
api:
  cors_origins:
  - http://localhost:5173
  - http://127.0.0.1:5173
  cors_allow_credentials: false
  cors_allow_methods:
  - GET
  - POST
  - HEAD
  - OPTIONS
  cors_allow_headers:
  - '*'
  stream_chunk_size_bytes: 1048576
  resolver_cache_size: 8
  default_page_size: 100
  maximum_page_size: 1000
