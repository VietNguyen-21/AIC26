[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026-tv1-tv3-wp04"
version = "0.20.0rc2+tv1.tv3"
description = "AIC 2026 TV1 raw preprocessing integrated with TV3 WP04 evidence retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
production = ["av>=12,<16", "scenedetect[opencv]>=0.6.4,<0.7", "torch>=2.2,<3"]
parquet = ["pyarrow>=15,<24"]
ocr = []
asr = ["silero-vad>=6.0", "torch>=2.2,<3"]
object = ["rfdetr", "torch>=2.2,<3", "Pillow>=10"]
metadata = ["openpyxl>=3.1"]
text = ["opensearch-py>=2.6", "elasticsearch>=8.13"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "openpyxl>=3.1", "ruff>=0.9,<1", "mypy>=1.13,<2", "types-PyYAML>=6.0"]
tv3 = ["aic2026-tv1-tv3-wp04[ocr,asr,object,metadata,text]"]
full = ["aic2026-tv1-tv3-wp04[production,parquet,tv3,dev]"]

[project.scripts]
aic = "aic2026.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "backend/tests"]
addopts = "-ra"
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "real_video: tests that invoke ffmpeg/ffprobe",
  "optional_runtime: tests requiring optional production dependencies",
]

[tool.coverage.run]
source = ["src/aic2026"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
